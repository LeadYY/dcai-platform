<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 对话</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f5f5f7;height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:32px;width:380px}
h1{font-size:22px;margin-bottom:20px;text-align:center}
input{width:100%;padding:10px 12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:14px}
button{width:100%;padding:11px;background:#007aff;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-top:8px}
button:hover{background:#0066d6}
.switch{text-align:center;margin-top:14px;font-size:13px;color:#666}
.switch span{color:#007aff;cursor:pointer}
.chat-wrap{display:none;flex-direction:column;width:100%;max-width:680px;height:90vh;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.08);overflow:hidden}
.chat-header{padding:14px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.chat-header b{font-size:16px}
.chat-header button{width:auto;padding:6px 14px;font-size:13px;margin:0;background:#f0f0f0;color:#333}
#msgs{flex:1;overflow-y:auto;padding:20px}
.msg{margin-bottom:14px;max-width:80%}
.msg.user{margin-left:auto}
.bubble{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.user .bubble{background:#007aff;color:#fff;border-bottom-right-radius:4px}
.msg.ai .bubble{background:#f0f0f0;border-bottom-left-radius:4px}
.input-bar{padding:12px;border-top:1px solid #eee;display:flex;gap:8px}
.input-bar input{margin:0;flex:1}
.input-bar button{width:auto;margin:0;padding:10px 20px}
.err{color:#ff3b30;font-size:13px;text-align:center;margin-top:10px}
</style>
</head>
<body>

<div class="box" id="authBox">
  <h1>AI 对话平台</h1>
  <div id="loginView">
    <input type="email" id="loginEmail" placeholder="邮箱">
    <input type="password" id="loginPwd" placeholder="密码">
    <button onclick="doLogin()">登录</button>
    <div class="switch">还没有账号？<span onclick="showReg()">注册</span></div>
  </div>
  <div id="regView" style="display:none">
    <input type="email" id="regEmail" placeholder="邮箱">
    <input type="password" id="regPwd" placeholder="密码（至少 6 位）">
    <button onclick="doReg()">注册</button>
    <div class="switch">已有账号？<span onclick="showLogin()">登录</span></div>
  </div>
  <div class="err" id="authErr"></div>
</div>

<div class="chat-wrap" id="chatBox">
  <div class="chat-header">
    <b>AI 对话</b>
    <button onclick="doLogout()">退出</button>
  </div>
  <div id="msgs"></div>
  <div class="input-bar">
    <input id="input" placeholder="输入消息，回车发送..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>

<script>
async function api(path, opts={}) {
  const r = await fetch(path, {
    headers: {'Content-Type':'application/json'},
    credentials:'include',
    ...opts
  });
  return r.json();
}
function showReg(){document.getElementById('loginView').style.display='none';document.getElementById('regView').style.display='block';document.getElementById('authErr').textContent=''}
function showLogin(){document.getElementById('regView').style.display='none';document.getElementById('loginView').style.display='block';document.getElementById('authErr').textContent=''}
async function doReg(){
  const email=regEmail.value, pwd=regPwd.value;
  if(!email||!pwd){authErr.textContent='请填写邮箱和密码';return}
  const r=await api('/api/auth/register',{method:'POST',body:JSON.stringify({email,password:pwd})});
  if(r.error){authErr.textContent=r.error;return}
  enterChat();
}
async function doLogin(){
  const email=loginEmail.value, pwd=loginPwd.value;
  if(!email||!pwd){authErr.textContent='请填写邮箱和密码';return}
  const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password:pwd})});
  if(r.error){authErr.textContent=r.error;return}
  enterChat();
}
async function doLogout(){
  await api('/api/auth/logout',{method:'POST'});
  chatBox.style.display='none';authBox.style.display='block';
}
async function enterChat(){
  authBox.style.display='none';
  chatBox.style.display='flex';
  const r=await api('/api/chat');
  (r.messages||[]).forEach(m=>addMsg(m.role,m.content));
}
function addMsg(role,text){
  const d=document.createElement('div');
  d.className='msg '+(role==='user'?'user':'ai');
  d.innerHTML='<div class="bubble">'+text.replace(/</g,'&lt;')+'</div>';
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}
async function send(){
  const txt=input.value.trim();
  if(!txt)return;
  input.value='';
  addMsg('user',txt);
  addMsg('ai','思考中...');
  const last=msgs.lastElementChild.querySelector('.bubble');
  const r=await api('/api/chat',{method:'POST',body:JSON.stringify({message:txt})});
  if(r.error){last.textContent=r.error;return}
  last.textContent=r.reply;
  msgs.scrollTop=msgs.scrollHeight;
}
(async()=>{
  const me=await api('/api/auth/me');
  if(me.user)enterChat();
})();
</script>
</body>
</html>
